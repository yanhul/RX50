name: AIOS Workload Conformance

on:
  push:
    paths:
      - 'aios/**'
      - '*.md'
      - '.github/workflows/aios-conformance.yml'
  pull_request:
    paths:
      - 'aios/**'
      - '*.md'
      - '.github/workflows/aios-conformance.yml'

permissions:
  contents: read

env:
  AIOS_REF: 5fba88c58d89feed5363b95d3d03b31150d1fee7

jobs:
  workload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout pinned AIOS core
        uses: actions/checkout@v4
        with:
          repository: yanhul/AIOS
          ref: ${{ env.AIOS_REF }}
          path: .aios-core
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run bounded workload through central AIOS runner
        env:
          PYTHONPATH: .aios-core
        run: |
          python .aios-core/scripts/run_workload_adapter.py \
            --workload-id RX50 \
            --execution-id "rx50-${GITHUB_SHA}" \
            --cwd . \
            --problem "Evaluate the bounded RX50 engineering workload and report governed evidence." \
            --timeout-seconds 300 \
            -- env -u PYTHONPATH python -m aios.adapter
