name: AIOS Workload Conformance

on:
  push:
    paths:
      - 'aios/**'
      - '*.md'
      - '.github/workflows/aios-conformance.yml'
  pull_request:
    paths:
      - 'aios/**'
      - '*.md'
      - '.github/workflows/aios-conformance.yml'

jobs:
  workload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run bounded AIOS engineering workload adapter
        run: python -m aios.adapter
