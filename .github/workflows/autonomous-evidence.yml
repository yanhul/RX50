name: RX50 Autonomous Evidence Loop
# Gate 2 exact-head diagnostic: targeted boundary tests run before full regression.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: rx50-autonomous-evidence
  cancel-in-progress: false

env:
  RX50_STATE_BRANCH: automation/rx50-state

jobs:
  evidence-loop:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Load isolated durable state
        run: |
          set -euo pipefail
          git fetch origin "${RX50_STATE_BRANCH}"
          git rev-parse "origin/${RX50_STATE_BRANCH}" > /tmp/rx50-state-base
          git checkout "origin/${RX50_STATE_BRANCH}" -- \
            state/controller_state.json \
            harness/lineage/records.jsonl

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install test dependency
        run: python -m pip install pytest

      - name: Observe and resume durable controller
        run: python harness/controller.py

      - name: Persist durable lineage
        if: always()
        run: python harness/lineage/persist.py

      - name: Run AIOS static conformance
        run: python harness/aios_conformance.py

      - name: Run AIOS runtime adversarial conformance
        run: python harness/adversarial_conformance.py

      - name: Diagnose Gate 2 lineage tests
        continue-on-error: true
        run: |
          python -m pytest -q tests/test_gate2_lineage_boundary.py::test_lineage_without_evaluation_is_observation_only
          python -m pytest -q tests/test_gate2_lineage_boundary.py::test_effect_attempt_receipt_bindings_are_explicit_unknown_when_absent
          python -m pytest -q tests/test_gate2_lineage_boundary.py::test_missing_receipt_cannot_support_verified_pass
          python -m pytest -q tests/test_gate2_lineage_boundary.py::test_fake_top_level_verdict_is_rejected
          python -m pytest -q tests/test_gate2_lineage_boundary.py::test_fake_evaluation_verdict_is_rejected
          python -m pytest -q tests/test_gate2_lineage_boundary.py::test_execution_failure_after_observation_cannot_be_promoted_to_pass
          python -m pytest -q tests/test_gate2_lineage_boundary.py::test_known_receipt_requires_effect_and_attempt
          python -m pytest -q tests/test_gate2_lineage_boundary.py::test_old_state_plus_new_controller_fails_closed
          python -m pytest -q tests/test_gate2_lineage_boundary.py::test_state_schema_mismatch_fails_closed
          python -m pytest -q tests/test_gate2_lineage_boundary.py::test_policy_mismatch_fails_closed

      - name: Run regression tests
        run: python -m pytest -q

      - name: Persist isolated controller state
        if: ${{ github.ref == 'refs/heads/main' }}
        run: |
          set -euo pipefail
          cp state/controller_state.json /tmp/controller_state.json
          cp harness/lineage/records.jsonl /tmp/records.jsonl

          git checkout --detach "origin/${RX50_STATE_BRANCH}"
          cp /tmp/controller_state.json state/controller_state.json
          cp /tmp/records.jsonl harness/lineage/records.jsonl

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/controller_state.json harness/lineage/records.jsonl

          if git diff --cached --quiet; then
            echo "No controller or lineage state change."
            exit 0
          fi

          git commit -m "harness: persist RX50 controller and lineage checkpoint [skip ci]"

          expected="$(cat /tmp/rx50-state-base)"
          git push --force-with-lease="refs/heads/${RX50_STATE_BRANCH}:${expected}" \
            origin "HEAD:${RX50_STATE_BRANCH}"

      - name: Publish checkpoint artifact
        uses: actions/upload-artifact@v4
        with:
          name: rx50-controller-state
          path: |
            state/controller_state.json
            harness/lineage/records.jsonl
          if-no-files-found: error
