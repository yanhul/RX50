name: RX50 Autonomous Evidence Loop

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  pull-requests: write

concurrency:
  group: rx50-autonomous-evidence
  cancel-in-progress: false

env:
  RX50_STATE_BRANCH: automation/rx50-state

jobs:
  evidence-loop:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Load isolated durable state
        run: |
          set -euo pipefail
          git fetch origin "${RX50_STATE_BRANCH}"
          git rev-parse "origin/${RX50_STATE_BRANCH}" > /tmp/rx50-state-base
          git checkout "origin/${RX50_STATE_BRANCH}" -- \
            state/controller_state.json \
            harness/lineage/records.jsonl

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install test dependency
        run: python -m pip install pytest

      - name: Observe and resume durable controller
        run: python harness/controller.py

      - name: Persist durable lineage
        if: always()
        run: python harness/lineage/persist.py

      - name: Run AIOS static conformance
        run: python harness/aios_conformance.py

      - name: Run AIOS runtime adversarial conformance
        run: python harness/adversarial_conformance.py

      - name: Gate2 lineage_without_evaluation_is_observation_only
        continue-on-error: true
        run: python -m pytest -q tests/test_gate2_lineage_boundary.py::test_lineage_without_evaluation_is_observation_only

      - name: Gate2 effect_attempt_receipt_bindings_are_explicit_unknown_when_absent
        continue-on-error: true
        run: python -m pytest -q tests/test_gate2_lineage_boundary.py::test_effect_attempt_receipt_bindings_are_explicit_unknown_when_absent

      - name: Gate2 missing_receipt_cannot_support_verified_pass
        continue-on-error: true
        run: python -m pytest -q tests/test_gate2_lineage_boundary.py::test_missing_receipt_cannot_support_verified_pass

      - name: Gate2 fake_top_level_verdict_is_rejected
        continue-on-error: true
        run: python -m pytest -q tests/test_gate2_lineage_boundary.py::test_fake_top_level_verdict_is_rejected

      - name: Gate2 fake_evaluation_verdict_is_rejected
        continue-on-error: true
        run: python -m pytest -q tests/test_gate2_lineage_boundary.py::test_fake_evaluation_verdict_is_rejected

      - name: Gate2 execution_failure_after_observation_cannot_be_promoted_to_pass
        continue-on-error: true
        run: python -m pytest -q tests/test_gate2_lineage_boundary.py::test_execution_failure_after_observation_cannot_be_promoted_to_pass

      - name: Gate2 known_receipt_requires_effect_and_attempt
        continue-on-error: true
        run: python -m pytest -q tests/test_gate2_lineage_boundary.py::test_known_receipt_requires_effect_and_attempt

      - name: Gate2 old_state_plus_new_controller_fails_closed
        continue-on-error: true
        run: python -m pytest -q tests/test_gate2_lineage_boundary.py::test_old_state_plus_new_controller_fails_closed

      - name: Gate2 state_schema_mismatch_fails_closed
        continue-on-error: true
        run: python -m pytest -q tests/test_gate2_lineage_boundary.py::test_state_schema_mismatch_fails_closed

      - name: Gate2 policy_mismatch_fails_closed
        continue-on-error: true
        run: python -m pytest -q tests/test_gate2_lineage_boundary.py::test_policy_mismatch_fails_closed

      - name: Diagnose Phase 2 evidence tests
        continue-on-error: true
        run: python -m pytest -q tests/test_evidence_closure.py

      - name: Diagnose controller and CI boundary tests
        continue-on-error: true
        run: python -m pytest -q tests/test_controller.py tests/test_ci_persistence_boundary.py

      - name: Run regression tests
        id: regression
        continue-on-error: true
        run: python -m pytest -q

      - name: Diagnose remaining regression files
        if: steps.regression.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          {
            echo "Gate 2 regression-file diagnosis"
            for f in tests/test_*.py; do
              case "$f" in
                tests/test_gate2_lineage_boundary.py|tests/test_evidence_closure.py|tests/test_controller.py|tests/test_ci_persistence_boundary.py) continue ;;
              esac
              echo "===== $f ====="
              python -m pytest -q "$f"
              echo "exit=$?"
            done
          } > /tmp/regression-diagnosis.log 2>&1
          gh pr comment ${{ github.event.pull_request.number }} --body "```
$(cat /tmp/regression-diagnosis.log)
```"

      - name: Enforce regression result
        if: steps.regression.outcome == 'failure'
        run: exit 1

      - name: Persist isolated controller state
        if: ${{ github.ref == 'refs/heads/main' }}
        run: |
          set -euo pipefail
          cp state/controller_state.json /tmp/controller_state.json
          cp harness/lineage/records.jsonl /tmp/records.jsonl

          git checkout --detach "origin/${RX50_STATE_BRANCH}"
          cp /tmp/controller_state.json state/controller_state.json
          cp /tmp/records.jsonl harness/lineage/records.jsonl

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/controller_state.json harness/lineage/records.jsonl

          if git diff --cached --quiet; then
            echo "No controller or lineage state change."
            exit 0
          fi

          git commit -m "harness: persist RX50 controller and lineage checkpoint [skip ci]"

          expected="$(cat /tmp/rx50-state-base)"
          git push --force-with-lease="refs/heads/${RX50_STATE_BRANCH}:${expected}" \
            origin "HEAD:${RX50_STATE_BRANCH}"

      - name: Publish checkpoint artifact
        uses: actions/upload-artifact@v4
        with:
          name: rx50-controller-state
          path: |
            state/controller_state.json
            harness/lineage/records.jsonl
          if-no-files-found: error
