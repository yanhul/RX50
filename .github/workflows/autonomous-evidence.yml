name: RX50 Autonomous Evidence Loop

on:
  push:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: rx50-autonomous-evidence
  cancel-in-progress: false

jobs:
  evidence-loop:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install test dependency
        run: python -m pip install pytest

      - name: Observe and resume durable controller
        run: python harness/controller.py

      - name: Persist durable lineage
        if: always()
        run: python harness/lineage/persist.py

      - name: Run AIOS static conformance
        run: python harness/aios_conformance.py

      - name: Run AIOS runtime adversarial conformance
        run: python harness/adversarial_conformance.py

      - name: Run regression tests
        run: python -m pytest -q

      - name: Persist controller checkpoint and lineage
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/controller_state.json harness/lineage/records.jsonl
          if git diff --cached --quiet; then
            echo "No controller or lineage state change."
          else
            git commit -m "harness: persist RX50 controller and lineage checkpoint [skip ci]"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

      - name: Publish checkpoint artifact
        uses: actions/upload-artifact@v4
        with:
          name: rx50-controller-state
          path: |
            state/controller_state.json
            harness/lineage/records.jsonl
          if-no-files-found: error
