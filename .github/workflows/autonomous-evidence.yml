name: RX50 Autonomous Evidence Loop

on:
  push:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: rx50-autonomous-evidence
  cancel-in-progress: false

jobs:
  evidence-loop:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install test dependency
        run: python -m pip install pytest

      - name: Observe and resume durable controller
        run: python harness/controller.py

      - name: Run regression tests
        run: python -m pytest -q

      - name: Persist controller checkpoint
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/controller_state.json
          if git diff --cached --quiet; then
            echo "No controller state change."
          else
            git fetch origin main
            git rebase origin/main
            git add state/controller_state.json
            git commit -m "harness: persist RX50 controller checkpoint [skip ci]"
            git push origin HEAD:main
          fi

      - name: Publish checkpoint artifact
        uses: actions/upload-artifact@v4
        with:
          name: rx50-controller-state
          path: state/controller_state.json
          if-no-files-found: error
